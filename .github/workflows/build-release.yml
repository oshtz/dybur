name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/verify-release.js'
      - 'scripts/verify-release.test.js'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check Windows signing secrets
        id: windows-secrets
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $missing = @()
          if (-not $env:WINDOWS_CERTIFICATE) { $missing += "WINDOWS_CERTIFICATE" }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { $missing += "WINDOWS_CERTIFICATE_PASSWORD" }

          if ($missing.Count -eq 0) {
            "available=true" >> $env:GITHUB_OUTPUT
          } else {
            "available=false" >> $env:GITHUB_OUTPUT
            Write-Host "Windows signing secrets not configured; portable EXE will be unsigned. Missing: $($missing -join ', ')"
          }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/tray/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm --filter @dybur/config --filter @dybur/core --filter @dybur/cli build

      - name: Copy CLI to resources
        shell: pwsh
        run: |
          $resourcesDir = "apps/tray/src-tauri/resources"
          New-Item -ItemType Directory -Force -Path $resourcesDir | Out-Null
          Copy-Item "packages/cli/dist/cli.js" "$resourcesDir/cli.js"
          Write-Host "CLI copied to $resourcesDir/cli.js"

      - name: Build Tauri app (no bundles)
        working-directory: apps/tray
        run: pnpm tauri build --no-bundle

      - name: Debug - List build artifacts
        shell: pwsh
        run: |
          Write-Host "=== Contents of target/release ==="
          Get-ChildItem -Path "apps/tray/src-tauri/target/release" -ErrorAction SilentlyContinue |
            ForEach-Object {
              $sizeMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "  $($_.Name) - $sizeMB MB"
            }

          Write-Host "`n=== All DLLs in target directory (recursive) ==="
          Get-ChildItem -Path "apps/tray/src-tauri/target" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 1MB } |
            Sort-Object -Property Length -Descending |
            Select-Object -First 20 |
            ForEach-Object {
              $sizeMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "  $($_.FullName) - $sizeMB MB"
            }

          Write-Host "`n=== Checking ort cache directories ==="
          # ort 2.x uses different cache locations
          $ortCacheLocations = @(
            (Join-Path $env:USERPROFILE ".ort"),
            (Join-Path $env:LOCALAPPDATA "ort"),
            (Join-Path $env:USERPROFILE ".cache\ort")
          )
          foreach ($ortCache in $ortCacheLocations) {
            Write-Host "Checking: $ortCache"
            if (Test-Path $ortCache) {
              Get-ChildItem -Path $ortCache -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
                ForEach-Object {
                  $sizeMB = [math]::Round($_.Length / 1MB, 2)
                  Write-Host "  $($_.FullName) - $sizeMB MB"
                }
            } else {
              Write-Host "  Not found"
            }
          }

          Write-Host "`n=== Searching entire target for any onnx/ort DLLs ==="
          Get-ChildItem -Path "apps/tray/src-tauri/target" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "onnx|ort|directml" } |
            ForEach-Object {
              $sizeMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "  $($_.FullName) - $sizeMB MB"
            }

      - name: Cache Enigma Virtual Box installer
        id: cache-evb
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/enigmavb_setup.exe
          key: enigmavb-installer-v1

      - name: Download Enigma Virtual Box installer
        if: steps.cache-evb.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $evbUrls = @(
            "https://www.enigmaprotector.com/assets/files/enigmavb.exe",
            "https://enigmaprotector.com/assets/files/enigmavb.exe",
            "https://web.archive.org/web/2024/https://enigmaprotector.com/assets/files/enigmavb.exe"
          )
          $evbInstaller = Join-Path $env:RUNNER_TEMP "enigmavb_setup.exe"
          Remove-Item -Path $evbInstaller -Force -ErrorAction SilentlyContinue

          $downloaded = $false
          foreach ($evbUrl in $evbUrls) {
            Write-Host "Trying: $evbUrl"
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                $headers = @{
                  "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                  "Accept" = "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
                }
                Invoke-WebRequest -Uri $evbUrl -OutFile $evbInstaller -UseBasicParsing -Headers $headers -MaximumRedirection 5 -TimeoutSec 60

                if ((Test-Path $evbInstaller) -and (Get-Item $evbInstaller).Length -gt 1MB) {
                  $downloaded = $true
                  Write-Host "Downloaded successfully from $evbUrl"
                  break
                }
              } catch {
                Write-Host "Attempt $attempt failed: $_"
                Start-Sleep -Seconds 5
              }
            }
            if ($downloaded) { break }
          }

          if (-not $downloaded) {
            throw "Failed to download EVB installer. The enigmaprotector.com site may be blocking CI downloads. Try running the workflow again (cache will persist)."
          }

      - name: Install Enigma Virtual Box
        shell: pwsh
        run: |
          $evbInstaller = Join-Path $env:RUNNER_TEMP "enigmavb_setup.exe"

          if (-not (Test-Path $evbInstaller)) {
            throw "EVB installer not found at $evbInstaller"
          }

          $process = Start-Process -FilePath $evbInstaller -ArgumentList "/VERYSILENT","/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "EVB installer failed with exit code $($process.ExitCode)"
          }

          if (Test-Path "C:\Program Files (x86)\Enigma Virtual Box\enigmavbconsole.exe") {
            Write-Host "EVB installed successfully"
          } else {
            throw "EVB installation failed"
          }

      - name: Create portable exe
        shell: pwsh
        run: |
          # Debug: List all exe files in the target directory with sizes
          Write-Host "=== All exe files in target directory ==="
          Get-ChildItem -Path "apps/tray/src-tauri/target" -Recurse -Filter "*.exe" |
            Where-Object { $_.FullName -notmatch "\\deps\\" -and $_.FullName -notmatch "\\build\\" } |
            ForEach-Object {
              $sizeMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "$($_.FullName) - $sizeMB MB"
            }
          Write-Host "========================================="

          # Debug: List all DLL files in the release directory
          Write-Host "=== All DLL files in release directory ==="
          Get-ChildItem -Path "apps/tray/src-tauri/target/release" -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object {
              $sizeMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "$($_.Name) - $sizeMB MB"
            }
          Write-Host "========================================="

          # Look for dybur.exe first (the main tray app)
          $inputExe = $null
          $mainExePath = "apps/tray/src-tauri/target/release/dybur.exe"

          if (Test-Path $mainExePath) {
            $inputExe = (Resolve-Path $mainExePath).Path
            $sizeMB = [math]::Round((Get-Item $inputExe).Length / 1MB, 2)
            Write-Host "Found main exe at expected location: $inputExe ($sizeMB MB)"
          } else {
            Write-Host "Main exe not found at $mainExePath, searching..."

            # Search for the largest dybur exe in release folder (should be the tray app)
            $searchRoot = "apps/tray/src-tauri/target/release"
            if (Test-Path $searchRoot) {
              $candidates = Get-ChildItem -Path $searchRoot -Filter "*.exe" |
                Where-Object {
                  $_.Name -match "^dybur" -and
                  $_.Name -notmatch "sidecar"
                } |
                Sort-Object -Property Length -Descending

              Write-Host "Candidate exe files:"
              foreach ($c in $candidates) {
                $sizeMB = [math]::Round($c.Length / 1MB, 2)
                Write-Host "  $($c.Name) - $sizeMB MB"
              }

              if ($candidates.Count -gt 0) {
                $inputExe = $candidates[0].FullName
              }
            }
          }

          if (-not $inputExe) {
            Write-Host "ERROR: Could not find release exe"
            throw "Release exe not found"
          }

          $inputSize = [math]::Round((Get-Item $inputExe).Length / 1MB, 2)
          Write-Host "Selected input exe: $inputExe ($inputSize MB)"

          # Sanity check: The tray app should be at least 5MB
          if ($inputSize -lt 5) {
            Write-Host "WARNING: Selected exe is smaller than expected ($inputSize MB). This might be the wrong binary!"
          }
          $outputExe = Join-Path (Split-Path $inputExe -Parent) "dybur-windows-x64.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $outputExe) | Out-Null

          # Setup EVB staging directory
          $evbStaging = Join-Path $PWD "evb-staging"
          New-Item -ItemType Directory -Force -Path $evbStaging | Out-Null

          # Find and copy WebView2Loader.dll
          $webviewDll = Get-ChildItem -Path "apps/tray/src-tauri/target" -Filter "WebView2Loader.dll" -Recurse | Select-Object -First 1
          if (-not $webviewDll) {
            throw "WebView2Loader.dll not found"
          }
          Copy-Item -Path $webviewDll.FullName -Destination $evbStaging -Force
          Write-Host "Included WebView2Loader.dll: $($webviewDll.FullName)"

          # Find and copy ONNX runtime DLLs
          # The ort crate with copy-dylibs feature should place these next to the exe
          $releaseDir = "apps/tray/src-tauri/target/release"
          $targetDir = "apps/tray/src-tauri/target"

          # List of required ONNX-related DLLs
          $onnxDlls = @("onnxruntime.dll", "DirectML.dll")

          # First try the release directory
          foreach ($dllName in $onnxDlls) {
            $dllPath = Join-Path $releaseDir $dllName
            if (Test-Path $dllPath) {
              Copy-Item -Path $dllPath -Destination $evbStaging -Force
              $sizeMB = [math]::Round((Get-Item $dllPath).Length / 1MB, 2)
              Write-Host "Included $dllName from release dir ($sizeMB MB)"
            }
          }

          # Search entire target directory for ONNX DLLs if not found in release
          Write-Host "Searching for ONNX runtime DLLs in target directory..."
          $foundDlls = Get-ChildItem -Path $targetDir -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "^(onnxruntime|DirectML)" -and $_.Length -gt 1MB }

          foreach ($dll in $foundDlls) {
            $destPath = Join-Path $evbStaging $dll.Name
            if (-not (Test-Path $destPath)) {
              Copy-Item -Path $dll.FullName -Destination $evbStaging -Force
              $sizeMB = [math]::Round($dll.Length / 1MB, 2)
              Write-Host "Included $($dll.Name) from $($dll.Directory.Name) ($sizeMB MB)"
            }
          }

          # Check all ort cache directories (ort 2.x uses different locations)
          $ortCacheDirs = @(
            (Join-Path $env:USERPROFILE ".ort"),
            (Join-Path $env:LOCALAPPDATA "ort"),
            (Join-Path $env:USERPROFILE ".cache\ort")
          )
          foreach ($ortCacheDir in $ortCacheDirs) {
            if (Test-Path $ortCacheDir) {
              Write-Host "Checking ort cache: $ortCacheDir"
              Get-ChildItem -Path $ortCacheDir -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match "^(onnxruntime|DirectML)" -and $_.Length -gt 1MB } |
                ForEach-Object {
                  $destPath = Join-Path $evbStaging $_.Name
                  if (-not (Test-Path $destPath)) {
                    Copy-Item -Path $_.FullName -Destination $evbStaging -Force
                    $sizeMB = [math]::Round($_.Length / 1MB, 2)
                    Write-Host "Included $($_.Name) from ort cache ($sizeMB MB)"
                  }
                }
            }
          }

          # Check ORT_DYLIB_PATH if set
          if ($env:ORT_DYLIB_PATH -and (Test-Path $env:ORT_DYLIB_PATH)) {
            Write-Host "Checking ORT_DYLIB_PATH: $env:ORT_DYLIB_PATH"
            $ortDir = Split-Path $env:ORT_DYLIB_PATH -Parent
            Get-ChildItem -Path $ortDir -Filter "*.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match "^(onnxruntime|DirectML)" -and $_.Length -gt 1MB } |
              ForEach-Object {
                $destPath = Join-Path $evbStaging $_.Name
                if (-not (Test-Path $destPath)) {
                  Copy-Item -Path $_.FullName -Destination $evbStaging -Force
                  $sizeMB = [math]::Round($_.Length / 1MB, 2)
                  Write-Host "Included $($_.Name) from ORT_DYLIB_PATH ($sizeMB MB)"
                }
              }
          }

          # Verify we have at least one ONNX runtime DLL - if not, download it
          $hasOnnxRuntime = Get-ChildItem -Path $evbStaging -Filter "onnxruntime*.dll" -ErrorAction SilentlyContinue
          if (-not $hasOnnxRuntime) {
            Write-Host "ONNX runtime DLL not found in cache locations. Downloading directly..."

            # Download ONNX Runtime 1.19.2 (compatible with ort 2.0.0-rc.11)
            $ortVersion = "1.19.2"
            $ortUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$ortVersion/onnxruntime-win-x64-$ortVersion.zip"
            $ortZip = Join-Path $env:RUNNER_TEMP "onnxruntime.zip"
            $ortExtract = Join-Path $env:RUNNER_TEMP "onnxruntime"

            Write-Host "Downloading ONNX Runtime v$ortVersion..."
            Invoke-WebRequest -Uri $ortUrl -OutFile $ortZip -UseBasicParsing

            Write-Host "Extracting ONNX Runtime..."
            Expand-Archive -Path $ortZip -DestinationPath $ortExtract -Force

            # Find and copy the DLLs
            $ortDlls = Get-ChildItem -Path $ortExtract -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match "^onnxruntime" }
            foreach ($dll in $ortDlls) {
              $destPath = Join-Path $evbStaging $dll.Name
              if (-not (Test-Path $destPath)) {
                Copy-Item -Path $dll.FullName -Destination $evbStaging -Force
                $sizeMB = [math]::Round($dll.Length / 1MB, 2)
                Write-Host "Included $($dll.Name) from direct download ($sizeMB MB)"
              }
            }

            # Verify again after download
            $hasOnnxRuntime = Get-ChildItem -Path $evbStaging -Filter "onnxruntime*.dll" -ErrorAction SilentlyContinue
            if (-not $hasOnnxRuntime) {
              Write-Host "ERROR: Failed to obtain ONNX runtime DLL even after direct download!"
              throw "Critical dependency missing: onnxruntime.dll not found"
            }
          }

          # Include the CLI JS in the portable bundle (requires Node.js at runtime)
          $cliPath = "apps/tray/src-tauri/resources/cli.js"
          if (Test-Path $cliPath) {
            Copy-Item -Path $cliPath -Destination $evbStaging -Force
            Write-Host "Included CLI: $cliPath"
          } else {
            Write-Host "Warning: CLI not found at $cliPath"
          }

          # Show what's in the staging directory
          Write-Host "=== EVB Staging directory contents ==="
          Get-ChildItem -Path $evbStaging | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name) - $sizeMB MB"
          }
          Write-Host "======================================="

          # Generate EVB project file
          $evbProject = Join-Path $PWD "dybur.evb"
          pnpm --package=@insco/enigma-virtualbox dlx enigmavirtualbox generate $evbStaging --input $inputExe --output $outputExe --project-name $evbProject
          if ($LASTEXITCODE -ne 0) {
            throw "enigmavirtualbox generate failed"
          }

          # Run EVB console
          $evbConsole = "C:\Program Files (x86)\Enigma Virtual Box\enigmavbconsole.exe"
          if (-not (Test-Path $evbConsole)) {
            throw "enigmavbconsole.exe not found at $evbConsole"
          }
          & $evbConsole $evbProject
          if ($LASTEXITCODE -ne 0) {
            throw "enigmavbconsole failed"
          }

          if (Test-Path $outputExe) {
            $size = [math]::Round((Get-Item $outputExe).Length / 1MB, 2)
            Write-Host "Portable exe created: $size MB"

            # Validate the output is a reasonable size
            # ONNX runtime alone is ~10-20MB, so the portable should be at least 15MB
            if ($size -lt 15) {
              Write-Host "ERROR: Portable exe is too small ($size MB). Expected at least 15MB."
              Write-Host "This indicates missing dependencies (ONNX runtime, etc.)"
              throw "Portable exe validation failed: size $size MB is below minimum 15MB"
            }

            Write-Host "SUCCESS: Portable exe size validation passed ($size MB)"
          } else {
            throw "Failed to create portable exe"
          }
          "PORTABLE_EXE_PATH=$outputExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ("${{ steps.windows-secrets.outputs.available }}" -ne "true") {
            & ".\scripts\verify-windows-release.ps1" -InputFile $outputExe -MinSizeMB 15
            if ($LASTEXITCODE -ne 0) {
              throw "Windows release verifier failed"
            }
          }

      - name: Sign portable exe
        if: steps.windows-secrets.outputs.available == 'true'
        shell: pwsh
        env:
          PORTABLE_EXE_PATH: apps/tray/src-tauri/target/release/dybur-windows-x64.exe
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not (Test-Path -LiteralPath $env:PORTABLE_EXE_PATH)) {
            throw "Portable EXE not found at $env:PORTABLE_EXE_PATH"
          }

          $certPath = Join-Path $env:RUNNER_TEMP "dybur-windows-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object -Property FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
            throw "signtool.exe not found in Windows SDK"
          }

          $timestampUrl = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          & $signtool.FullName sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr $timestampUrl /td SHA256 $env:PORTABLE_EXE_PATH
          $exitCode = $LASTEXITCODE
          Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
            throw "signtool failed with exit code $exitCode"
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $env:PORTABLE_EXE_PATH
          if ($signature.Status -ne "Valid") {
            throw "Portable EXE signature status is $($signature.Status)"
          }

          Write-Host "Portable EXE signed by: $($signature.SignerCertificate.Subject)"

      - name: Verify portable exe
        if: steps.windows-secrets.outputs.available == 'true'
        shell: pwsh
        env:
          PORTABLE_EXE_PATH: apps/tray/src-tauri/target/release/dybur-windows-x64.exe
        run: |
          if (-not $env:PORTABLE_EXE_PATH) {
            throw "PORTABLE_EXE_PATH is empty"
          }

          if (-not (Test-Path -LiteralPath $env:PORTABLE_EXE_PATH)) {
            throw "Portable EXE not found at $env:PORTABLE_EXE_PATH"
          }

          if ("${{ steps.windows-secrets.outputs.available }}" -eq "true") {
            & ".\scripts\verify-windows-release.ps1" -InputFile $env:PORTABLE_EXE_PATH -MinSizeMB 15 -RequireSignature
          } else {
            & ".\scripts\verify-windows-release.ps1" -InputFile $env:PORTABLE_EXE_PATH -MinSizeMB 15
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Windows release verifier failed"
          }

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: dybur-windows-x64
          path: apps/tray/src-tauri/target/release/dybur-windows-x64.exe

      - name: Determine release tag
        id: release_tag
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if (-not $version) {
            throw "package.json version not found"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check for existing release
        id: release_check
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.release_tag.outputs.tag }}';
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.setOutput('exists', 'true');
            } catch (error) {
              core.setOutput('exists', 'false');
            }

      - name: Publish release artifact (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            apps/tray/src-tauri/target/release/dybur-windows-x64.exe

      - name: Publish release artifact (main create)
        if: github.ref == 'refs/heads/main' && steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            apps/tray/src-tauri/target/release/dybur-windows-x64.exe

      - name: Publish release artifact (main existing)
        if: github.ref == 'refs/heads/main' && steps.release_check.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            apps/tray/src-tauri/target/release/dybur-windows-x64.exe

  build-macos:
    runs-on: macos-26

    steps:
      - name: Check Apple signing secrets
        id: apple-secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          if [ -z "$APPLE_CERTIFICATE" ]; then missing=1; fi
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then missing=1; fi
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then missing=1; fi
          if [ -z "$APPLE_ID" ]; then missing=1; fi
          if [ -z "$APPLE_PASSWORD" ]; then missing=1; fi
          if [ -z "$APPLE_TEAM_ID" ]; then missing=1; fi

          if [ "$missing" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets not configured; building unsigned app."
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/tray/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install macOS build dependencies
        run: brew install create-dmg

      - name: Build TypeScript packages
        run: pnpm --filter @dybur/config --filter @dybur/core --filter @dybur/cli build

      - name: Copy CLI to resources
        run: |
          mkdir -p apps/tray/src-tauri/resources
          cp packages/cli/dist/cli.js apps/tray/src-tauri/resources/cli.js
          echo "CLI copied to apps/tray/src-tauri/resources/cli.js"

      - name: Import Apple signing certificate
        if: steps.apple-secrets.outputs.available == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Build Tauri app (signed)
        if: steps.apple-secrets.outputs.available == 'true'
        working-directory: apps/tray
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Build Tauri app (unsigned)
        if: steps.apple-secrets.outputs.available != 'true'
        working-directory: apps/tray
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Find built artifacts
        id: find-artifacts
        run: |
          DMG_PATH=$(find apps/tray/src-tauri/target -name "*.dmg" -type f | head -1)

          if [ -n "$DMG_PATH" ]; then
            DMG_DIR=$(dirname "$DMG_PATH")
            RELEASE_DMG_PATH="$DMG_DIR/dybur-macos-arm64.dmg"
            cp "$DMG_PATH" "$RELEASE_DMG_PATH"
            echo "dmg_path=$RELEASE_DMG_PATH" >> "$GITHUB_OUTPUT"
            echo "Found DMG: $DMG_PATH"
            echo "Created release DMG: $RELEASE_DMG_PATH"
          fi

      - name: Upload macOS DMG
        if: steps.find-artifacts.outputs.dmg_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: dybur-macos-dmg
          path: ${{ steps.find-artifacts.outputs.dmg_path }}

      - name: Determine release tag
        id: release_tag
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: release_check
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.release_tag.outputs.tag }}';
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.setOutput('exists', 'true');
            } catch (error) {
              core.setOutput('exists', 'false');
            }

      - name: Publish release artifacts (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ${{ steps.find-artifacts.outputs.dmg_path }}

      - name: Publish release artifacts (main create)
        if: github.ref == 'refs/heads/main' && steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.find-artifacts.outputs.dmg_path }}

      - name: Publish release artifacts (main existing)
        if: github.ref == 'refs/heads/main' && steps.release_check.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            ${{ steps.find-artifacts.outputs.dmg_path }}

  publish-update-manifest:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Generate update manifest
        shell: bash
        env:
          VERSION: ${{ steps.release_tag.outputs.version }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          function findArtifact(name) {
            const root = path.resolve('release-artifacts');
            const stack = [root];
            while (stack.length > 0) {
              const current = stack.pop();
              for (const entry of fs.readdirSync(current, { withFileTypes: true })) {
                const fullPath = path.join(current, entry.name);
                if (entry.isDirectory()) {
                  stack.push(fullPath);
                } else if (entry.name === name) {
                  return fullPath;
                }
              }
            }
            throw new Error(`Artifact not found: ${name}`);
          }

          function describeArtifact(name) {
            const artifactPath = findArtifact(name);
            const bytes = fs.readFileSync(artifactPath);
            return {
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/${name}`,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
              size: bytes.length,
            };
          }

          const manifest = {
            version: process.env.VERSION,
            pub_date: new Date().toISOString(),
            platforms: {
              'windows-x64': describeArtifact('dybur-windows-x64.exe'),
              'darwin-arm64': describeArtifact('dybur-macos-arm64.dmg'),
            },
          };

          fs.writeFileSync('dybur-update.json', `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(JSON.stringify(manifest, null, 2));
          NODE

      - name: Publish update manifest
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            dybur-update.json
