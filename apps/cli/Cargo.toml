[package]
name = "dybur-cli"
version = "1.0.0"
description = "dybur CLI - Local voice dictation"
authors = ["Omer Shatzberg <omershatzberg@gmail.com>"]
license = "MIT"
repository = "https://github.com/oshtz/dybur"
edition = "2021"

[[bin]]
name = "dybur"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
cpal = "0.15"
chrono = "0.4"
crossterm = "0.28"

# Windows-specific for process management
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
